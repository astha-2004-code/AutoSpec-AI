name: AutoSpec AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    name: Backend Lint, Alembic & Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Verify Alembic Migrations
        env:
          AUTOSPEC_DATABASE_URL: sqlite:///./ci_migration_test.db
        run: |
          alembic upgrade head
          rm -f ci_migration_test.db

      - name: Run Pytest Suite
        env:
          AUTOSPEC_EMBEDDING_MODEL: mock
        run: pytest -v --durations=10

  frontend-quality:
    name: Frontend Format, Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run ESLint, TypeScript Check & Format Verification
        working-directory: frontend
        run: |
          npm run format:check
          npm run lint
          npx tsc -b --noEmit

      - name: Run Vitest Component Tests
        working-directory: frontend
        run: npm test

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build

  docker-validation:
    name: Validate Docker Compose & Frontend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config -q

      - name: Build Frontend Production Container
        run: docker build -t autospec-web:ci -f frontend/Dockerfile ./frontend
