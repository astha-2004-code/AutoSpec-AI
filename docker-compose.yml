services:
  autospec-db:
    image: pgvector/pgvector:pg16
    container_name: autospec-pgvector
    environment:
      - POSTGRES_USER=autospec
      - POSTGRES_PASSWORD=autospec_dev
      - POSTGRES_DB=autospec
    ports:
      - "5432:5432"
    volumes:
      - autospec-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autospec -d autospec"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  autospec-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autospec-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+psycopg2://autospec:autospec_dev@autospec-db:5432/autospec
      - DATABASE_URL_UNPOOLED=postgresql+psycopg2://autospec:autospec_dev@autospec-db:5432/autospec
      - AUTOSPEC_ENV=development
      - AUTOSPEC_STORAGE_DIR=/app/storage
      - AUTOSPEC_LLM_PROVIDER=none
      - AUTOSPEC_DEMO_MODE=true
      - AUTOSPEC_ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:5173","http://127.0.0.1:5173"]
    volumes:
      - autospec-storage:/app/storage
    depends_on:
      autospec-db:
        condition: service_healthy
    restart: unless-stopped

  autospec-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autospec-web
    ports:
      - "3000:80"
    depends_on:
      autospec-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  autospec-pgdata:
  autospec-storage:
